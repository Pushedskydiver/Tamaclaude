<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" width="320" height="172">
  <!--
    Clawd: boot splash (the panel has power, nothing has driven it yet)

    Generated against assets/clawd/base.svg. Every base element appears below
    at its original coordinates and colours; the pose is transforms only.

    This is the one picture the device draws by itself. Everything else on this
    panel is rendered on the Mac and blitted, so this is the only art that has
    to survive with no host attached — it is what a plugged-in, unpaired
    Tamaclaude shows, and it is never redrawn once the host paints over it.
    A dark panel therefore still means a fault, which is the property the
    placeholder fill it replaces existed to protect.

    ── The pose ──────────────────────────────────────────────────────────

    One claw raised in a wave, the other resting flush against the lower
    body. The far claw matters more than it looks: left at its base position
    it sits at mid-height on the opposite side and reads as a snout, which
    turns Clawd into a pig facing the wrong way. Dropping it two units puts it
    level with the torso's underside, where it reads as a resting claw and
    keeps the silhouette unbroken. Rotating it there instead cut a notch out
    of the torso edge that looked like a rendering fault.

    The raised claw is the only rotated element. `tools/svg2frames.ts` snaps
    every rasterised pixel to the palette declared below, so the diagonal
    collapses onto whole device pixels after the fact rather than being
    forbidden — the same licence the animations were rebuilt to use.

    ── The wordmark ──────────────────────────────────────────────────────

    Departure Mono, the same face the panel already draws quips in, so the
    splash and the running device share one voice. `tools/bake-splash.ts`
    injects the @font-face from `assets/fonts/` and asserts the measured width
    before baking: a font that silently failed to load would fall back to a
    system monospace and bake a wordmark that is wrong in a way no test after
    that point can see.

    `tama` in the panel's foreground grey, `claude` in the orange that is also
    Clawd's own body tone — the split reads as one word while still saying
    which half is the character.

    ── The shadow ────────────────────────────────────────────────────────

    A flat colour, not `opacity`. `paletteOf` composites a partly-transparent
    fill over black to decide what tone it becomes, but this splash sits on
    #0D1117 rather than the animations' black stage, so the composited tone
    would not be in the palette and would snap to the ground colour — the
    shadow would vanish, quietly, only in the baked output.
  -->

  <rect id="ground" x="0" y="0" width="320" height="172" fill="#0D1117"/>

  <g id="master-group" transform="translate(10,28)">
    <rect id="ground-shadow" x="21" y="105" width="63" height="7" fill="#060910"/>

    <g id="body-color-group" fill="#DE886D">
      <rect id="torso" x="14" y="42" width="77" height="49"/>
      <!-- Raised: lifted clear of the torso line, then tilted. -->
      <rect id="left-arm" x="0" y="63" width="14" height="14"
            transform="translate(7,-35) rotate(-20 14 77)"/>
      <!-- Resting: dropped two units to sit flush with the torso underside. -->
      <rect id="right-arm" x="91" y="63" width="14" height="14"
            transform="translate(0,14)"/>

      <rect id="outer-left-leg"  x="21" y="91" width="7" height="14"/>
      <rect id="inner-left-leg"  x="35" y="91" width="7" height="14"/>
      <rect id="inner-right-leg" x="63" y="91" width="7" height="14"/>
      <rect id="outer-right-leg" x="77" y="91" width="7" height="14"/>
    </g>

    <g id="eyes-color-group" fill="#000000">
      <rect id="left-eye"  x="28" y="56" width="7" height="14"/>
      <rect id="right-eye" x="70" y="56" width="7" height="14"/>
    </g>
  </g>

  <text id="wordmark" x="140" y="97" font-size="26"
        font-family="Departure Mono, monospace" fill="#C9D1D9">tama<tspan fill="#F77849">claude</tspan></text>
</svg>

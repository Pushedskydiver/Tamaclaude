<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -9 21 25" width="168" height="200"
     data-loop-seconds="12">
  <!--
    Clawd: asleep (no session for five minutes)

    Twelve seconds, 96 frames. Long, because a sleeping creature should be the
    calmest thing on the panel and a short loop makes a resting breath into a
    pant. Three breaths fit the loop, and the middle one is a sigh.

    ── How it is put together ─────────────────────────────────────────────

    Two nested groups on the same floor pivot at (7.5,15), so their squashes
    compose into one scale rather than shearing against each other:

      #sleeper   12s   the sigh — flat over the first breath, deep over the
                       second, flat again for the third
      #chest      4s   the breath itself: exhale, hold, inhale, pause

    `scaleY` stays below 1 in both tracks. That is the whole trick and it is
    the opposite of what looks obvious. A breath that *lifts* the torso hauls
    it off the legs, which are planted outside both groups, and leaves them as
    four floating stubs — that shipped here, and in `idle`, before it was
    understood. Compressing about a floor pivot cannot do it: the underside is
    the pivot, so it is pushed down into the leg tops and never lifts off them.

    ── The pose ───────────────────────────────────────────────────────────

    Both claws hang two whole art pixels below where the base geometry puts
    them, which is what distinguishes this from `idle` at a glance — the arms
    have gone slack. Only the left one dreams, drifting on its own track.

    They translate; they do not rotate. A 2x2 block turned a few degrees is a
    staircase, and it lifts its inner corner off the torso and opens a hairline
    of background at the shoulder. Both artefacts shipped here before. A
    whole-unit slide keeps the inner edge welded to the body at every frame.

    The eyes squash about their OUTER edge rather than their centre. About the
    centre a 1x2 rect scaled (2, 0.5) lands half an art pixel off the grid in
    both axes and straddles four cells; pinned at the outer edge it lands on
    whole cells and stays symmetric about the torso's centre line.

    ── The Zs ─────────────────────────────────────────────────────────────

    Three of them, one keyframe track and three delays two seconds apart. The
    columns differ in geometry rather than in animation, so there is nothing to
    keep in sync.

    Two things about them are hard-won. They start *above* the head and only
    ever rise: an earlier version took upstream's y=7 start literally, but
    upstream's crab is splooted flat and ours is standing, so the same
    coordinate is mid-chest — grey Zs sat across his face on 76 of 96 frames
    and read as display corruption. And each glyph cell is a whole art pixel.
    Capping the growth to protect the spacing had them rendering at half a
    pixel a cell, where the diagonal degenerates and a Z becomes an I.
  -->
  <defs>
    <style>
      /* The sigh wraps the breath on the same pivot, so the two squashes
         compose into one scale about the floor rather than shearing. */
      #sleeper {
        transform-origin: 7.5px 15px;
        animation: sigh 12s infinite ease-in-out;
      }

      #chest {
        transform-origin: 7.5px 15px;
        animation: breathe 4s infinite ease-in-out;
      }

      /* Both claws hang two whole art pixels below where the base puts them;
         only the left one dreams. Translation, not rotation: a 2x2 block
         turned a few degrees is a staircase and lifts its inner corner off
         the torso, and both artefacts shipped here before. A whole-unit slide
         keeps the inner edge welded to x=2 (and to x=13) at every frame. */
      #left-arm {
        animation: left-claw 12s infinite linear;
      }

      #right-arm {
        transform: translate(0px, 2px);
      }

      /* Squash about each eye's OUTER edge, not its centre. About the centre
         a 1x2 rect scaled (2, 0.5) lands on x 3.5..5.5, y 8.5..9.5 — the right
         size and half an art pixel off the grid in both axes, so the dash
         straddles four art cells. Pinned at the outer edge it lands on whole
         cells and stays symmetric about the torso's centre line. */
      #left-eye {
        transform-origin: 5px 8px;
        animation: eyelid 12s infinite linear;
      }

      #right-eye {
        transform-origin: 10px 8px;
        animation: eyelid 12s infinite linear;
      }

      /* Shared setup for all three Zs. Deliberately carries no animation
         property: `#fx-zs > g` is an id plus a type and so outranks a bare
         `#z-2`, and an `animation` shorthand here would reset the delays that
         do the staggering. The zero opacity is the resting state for a viewer
         with animation disabled, where all three would otherwise sit at the
         glyph's untransformed origin. */
      #fx-zs > g {
        opacity: 0;
      }

      /* One keyframe set, three delays. The three columns differ in the
         geometry, not in the animation, so there is nothing to keep in sync. */
      #z-1 { animation: float 6s 0s infinite linear; }
      #z-2 { animation: float 6s -2s infinite linear; }
      #z-3 { animation: float 6s -4s infinite linear; }

      /* Exhale, hold, inhale, pause. scaleY is below 1 throughout, so the
         underside is pushed DOWN into the leg tops and never lifts off them. */
      @keyframes breathe {
        0%             { transform: scale(1, 1); }
        31.25%, 43.75% { transform: scale(1.04, 0.95); }
        78.125%        { transform: scale(1, 1); }
        100%           { transform: scale(1, 1); }
      }

      /* Flat over the first breath, deep over the second, flat again for the
         third. 43.75%-47.917% of 12s is 5.25s-5.75s, which is exactly the
         second breath's own hold. */
      @keyframes sigh {
        0%, 33.333%     { transform: scale(1, 1); }
        43.75%, 47.917% { transform: scale(1.04, 0.93); }
        66.667%, 100%   { transform: scale(1, 1); }
      }

      /* Up fast, back slowly — a twitch, not a wave. Two art pixels of
         travel, all of it along the torso's own edge. */
      @keyframes left-claw {
        0%, 75%       { transform: translate(0px, 2px); }
        77.083%       { transform: translate(0px, 0px); }
        80.208%       { transform: translate(0px, 1px); }
        83.333%, 100% { transform: translate(0px, 2px); }
      }

      /* Shut throughout; a whole art pixel narrower on the dream beat. Never
         scale(_, 0), and never narrower than one art pixel. The two steps are
         one frame apart, so no rendered frame catches an intermediate width. */
      @keyframes eyelid {
        0%, 75%         { transform: scale(2, 0.5); }
        76.042%, 81.25% { transform: scale(1, 0.5); }
        82.292%, 100%   { transform: scale(2, 0.5); }
      }

      /* Four art pixels of climb in thirty-two frames: exactly one device
         pixel per frame, so every rendered position is a whole device pixel
         and the glyph never antialiases. Opacity is 0 or 1 and nothing else —
         the step between them is one frame wide. */
      @keyframes float {
        0%       { transform: translateY(1px); opacity: 1; }
        66.667%  { transform: translateY(-3px); opacity: 1; }
        68.75%   { transform: translateY(-3px); opacity: 0; }
        100%     { transform: translateY(-3px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- ── base geometry: assets/clawd/base.svg, less its shadow ───────── -->

  <g id="body-color-group" fill="#DE886D">
    <!-- Outside both animated groups: the feet are on the floor and stay
         there while the body settles onto them. -->
    <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
    <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
    <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
    <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>

    <g id="sleeper">
      <g id="chest">
        <rect id="torso" x="2" y="6" width="11" height="7"/>
        <rect id="left-arm" x="0" y="9" width="2" height="2"/>
        <rect id="right-arm" x="13" y="9" width="2" height="2"/>

        <g id="eyes-color-group" fill="#000000">
          <rect id="left-eye" x="4" y="8" width="1" height="2"/>
          <rect id="right-eye" x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Zs, one art pixel per glyph cell. Four columns wide and four rows tall,
       drawn at each column's own x so that one `float` keyframe set can drive
       all three. The diagonal crosses two interior columns, which is what
       separates a Z from an I; at three rows the single interior cell sits on
       the centre line and the glyph rasterises as an I instead. -->
  <!-- **Two tones, and it took a measurement to find out why.** The glyph was a
       single flat `#CFD8DC`, which composed on the real panel reads 1.83:1
       against the day sky — below the 2:1 the two-tone rule exists to clear, on
       the sky the daemon shows for nine hours. Each Z now carries a black copy
       of itself one unit below, drawn behind it, so the pale carries the dark
       skies and the shadow carries the pale ones: dawn 3.94 -> 7.76, day
       1.83 -> 10.64, dusk and night unchanged at 5.91 and 12.89.

       Measured landscape with `extent: 'panel'`, which is what `daemon.ts`
       ships. State the orientation with any contrast figure: landscape crops 32
       raster rows, which slides a prop a whole sky band, and the same art
       measured portrait gives different answers on three of the four skies.

       **The offset is vertical because sideways would make them touch.** The
       three Zs sit one art unit apart when they share rows; they never share
       columns. So down is the only free direction, and `PLANS.md` §Asleep puts
       Zs that touch on its Not-wanted list.

       `#000000` is already in the palette — the eyes are black — so nothing new
       becomes a snap target for every other colour's antialiased edges.

       The shadow is inside each `z-N` group rather than a fourth sibling, so it
       inherits the float track and the `opacity: 0` resting state without a
       second animation declaration. It is a grandchild of `#fx-zs`, so the
       `#fx-zs > g` rule above does not match it. -->
  <g id="fx-zs" fill="#CFD8DC">
    <g id="z-1">
      <g fill="#000000">
        <rect x="0" y="1" width="4" height="1"/>
        <rect x="2" y="2" width="1" height="1"/>
        <rect x="1" y="3" width="1" height="1"/>
        <rect x="0" y="4" width="4" height="1"/>
      </g>
      <rect x="0" y="0" width="4" height="1"/>
      <rect x="2" y="1" width="1" height="1"/>
      <rect x="1" y="2" width="1" height="1"/>
      <rect x="0" y="3" width="4" height="1"/>
    </g>
    <g id="z-2">
      <g fill="#000000">
        <rect x="5" y="1" width="4" height="1"/>
        <rect x="7" y="2" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1"/>
        <rect x="5" y="4" width="4" height="1"/>
      </g>
      <rect x="5" y="0" width="4" height="1"/>
      <rect x="7" y="1" width="1" height="1"/>
      <rect x="6" y="2" width="1" height="1"/>
      <rect x="5" y="3" width="4" height="1"/>
    </g>
    <g id="z-3">
      <g fill="#000000">
        <rect x="10" y="1" width="4" height="1"/>
        <rect x="12" y="2" width="1" height="1"/>
        <rect x="11" y="3" width="1" height="1"/>
        <rect x="10" y="4" width="4" height="1"/>
      </g>
      <rect x="10" y="0" width="4" height="1"/>
      <rect x="12" y="1" width="1" height="1"/>
      <rect x="11" y="2" width="1" height="1"/>
      <rect x="10" y="3" width="4" height="1"/>
    </g>
  </g>
</svg>

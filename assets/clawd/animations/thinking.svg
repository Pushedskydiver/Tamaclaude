<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -9 21 25" width="168" height="200">
  <!--
    Clawd: thinking (UserPromptSubmit)

    Generated against assets/clawd/base.svg under the contract in
    docs/ANIMATION.md. Every base element appears below at its original
    coordinates and colours; all motion is CSS applied by ID.

    A thought bubble, not cogs. The first version rotated two cogs by pose
    swapping, and the technique worked while the shape did not: at 5x5 with a
    3x3 hub, the diagonal-teeth pose reads as a blob with corner dots rather
    than a turned cog, and the two poses look like different objects instead of
    one object rotating.

    A bubble is better on every axis this project cares about. It needs no
    rotation, which is the constraint that made the cogs hard. Its tail dots
    descend toward the torso without touching it, which is what a thought
    bubble does — see the note on the group below, and docs/ANIMATION.md
    §Props need contact for why that differs from a barbell. And three dots
    filling in sequence is the most legible "thinking" signal there is.

    Loop: 1.0s at 8fps. Every keyframe percentage lands on a quarter, which is
    two frames. Nothing runs at 0.125s. Every transform lands on a whole device
    pixel: the sway is half an art pixel, exactly 4 device pixels at scale 8.
  -->
  <defs>
    <style>
      /* Deliberation, not effort: half a pixel of sway across the whole loop,
         a quarter the cadence of typing's jitter. */
      #master-group {
        animation: sway 1s infinite steps(1);
      }

      /* Looking up at the bubble rather than at the viewer. */
      #left-eye,
      #right-eye {
        animation: look-up 0.5s infinite steps(1);
      }

      /* Three dots filling in, then a beat of nothing before the next pass.
         Binary opacity only — an intermediate alpha becomes an intermediate
         colour once the palette is quantised. */
      #dot-1 { animation: dot-1 1s infinite steps(1); }
      #dot-2 { animation: dot-2 1s infinite steps(1); }
      #dot-3 { animation: dot-3 1s infinite steps(1); }

      @keyframes sway {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(0.5px); }
        100% { transform: translateX(0); }
      }

      @keyframes look-up {
        0%   { transform: translate(0, -1px); }
        50%  { transform: translate(1px, -1px); }
        100% { transform: translate(0, -1px); }
      }

      @keyframes dot-1 {
        0%   { opacity: 1; }
        75%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes dot-2 {
        0%   { opacity: 0; }
        25%  { opacity: 1; }
        75%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes dot-3 {
        0%   { opacity: 0; }
        50%  { opacity: 1; }
        75%  { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- ── the thought bubble, behind Clawd so the tail tucks under him ──── -->
  <!-- The tail stops a unit short of the torso rather than touching it. The
       "props need contact" rule came from the barbell and the laptop, and it
       applies to props a character physically holds. A thought bubble is not
       held — it is a symbolic overlay, and comics convention floats it, with
       the descending dots doing the connecting. Attached, it read as a lump
       growing out of his head. -->
  <g id="fx-bubble" fill="#C9D1D9">
    <rect x="6" y="-3" width="9" height="5"/>
    <rect x="7" y="-4" width="7" height="1"/>
    <rect x="7" y="2" width="7" height="1"/>
    <rect id="tail-large" x="5" y="3" width="2" height="1"/>
    <rect id="tail-small" x="4" y="4" width="1" height="1"/>
  </g>

  <g id="fx-bubble-dots" fill="#30363B">
    <rect id="dot-1" x="8" y="-1" width="1" height="1"/>
    <rect id="dot-2" x="10" y="-1" width="1" height="1"/>
    <rect id="dot-3" x="12" y="-1" width="1" height="1"/>
  </g>

  <!-- ── base geometry: assets/clawd/base.svg, verbatim ────────────────── -->
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g id="master-group">
    <g id="body-color-group" fill="#DE886D">
      <rect id="torso" x="2" y="6" width="11" height="7"/>
      <rect id="left-arm" x="0" y="9" width="2" height="2"/>
      <rect id="right-arm" x="13" y="9" width="2" height="2"/>

      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>
    </g>

    <g id="eyes-color-group" fill="#000000">
      <rect id="left-eye" x="4" y="8" width="1" height="2"/>
      <rect id="right-eye" x="10" y="8" width="1" height="2"/>
    </g>
  </g>
</svg>

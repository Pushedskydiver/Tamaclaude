<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -9 21 25" width="168" height="200"
     data-loop-seconds="12">
  <!--
    Clawd: dizzy (StopFailure)

    A turn failed. Clawd has taken a knock and is seeing stars.

    Generated against assets/clawd/base.svg. Every base element appears below
    at its original coordinates and colours; all motion is CSS applied by ID.

    ── Twelve seconds, because FAILED does not decay ──────────────────────

    `effectiveState` in packages/daemon/src/session.ts promotes only from
    `IDLE`, so this stays on screen until another event arrives or the session
    is evicted ten minutes later. It is a resting screen, not a beat, and it
    has to survive being stared at — which is why the plan's first draft of a
    four second loop was wrong, and why it is built like `idle` instead.

    ── Why nothing rotates ────────────────────────────────────────────────

    Not the body: `docs/ANIMATION.md` §Scale by size, not by taste records a
    2.5deg torso tilt reading as a corrupted sprite, and a 6deg one measured
    nine one-pixel steps across the top edge. The wobble is translation against
    planted legs, half a unit each way — four whole device pixels, so no edge
    lands on a fraction.

    Not the stars either. A one-pixel prop is entirely edge, and rotating one
    is a still pixel with a fringe: at a fractional position the snap resolves
    it toward the body colour, which is the defect `thinking` documents for its
    bubble and the boot splash hit again in its wordmark. So the orbit is
    twelve discrete cells on whole units, stepped with `steps(1)`.

    Twelve is the number that makes the phasing work. The orbit is 3s — 24
    frames — so twelve cells is two frames each, and the three stars sit four
    cells apart. They do not step in unison: -1s and -2s are a third and two
    thirds of a 3s period, which no float represents exactly, so `steps(1)`
    resolves them on different frames and the spacing alternates 4/4/4 and
    3/4/5. That reads better than the alternative — one star advances per
    frame rather than all three every other frame — but it is not the even
    spacing an earlier version of this note claimed. Three on a four second loop cannot be evenly
    phased at all, because 32/3 is not an integer.

    ── The eyes ───────────────────────────────────────────────────────────

    Crossed, by moving each two units inward. Whole art pixels, existing IDs,
    translation only. A held `scaleY` squash was the obvious alternative and is
    exactly what `asleep` holds for its entire loop, so it would have made the
    two screens one picture.

    ── Not distress ───────────────────────────────────────────────────────

    `StopFailure` is a failed turn, not a catastrophe, and the strip tint
    already carries the severity. Nothing here flashes, shakes or reddens.
  -->

  <defs>
    <style>
      /* Whole art pixels throughout. One frame of the twelve second loop is
         1.041667%; the 3s orbit inside it is 24 frames, and 12s / 3s is 4, so
         it tiles exactly and the loop seam is clean. */

      #fx-star-a {
        animation: orbit 3s infinite steps(1);
      }

      /* Four cells apart, which is a third of the orbit. Negative delays start
         each star already in position rather than waiting to enter. */
      #fx-star-b { animation: orbit 3s -1s infinite steps(1); }
      #fx-star-c { animation: orbit 3s -2s infinite steps(1); }

      @keyframes orbit {
        0.000000% { transform: translate(5px, 0px); }
        8.333333% { transform: translate(4px, -2px); }
        16.666667% { transform: translate(3px, -3px); }
        25.000000% { transform: translate(0px, -3px); }
        33.333333% { transform: translate(-2px, -3px); }
        41.666667% { transform: translate(-4px, -2px); }
        50.000000% { transform: translate(-5px, 0px); }
        58.333333% { transform: translate(-4px, 2px); }
        66.666667% { transform: translate(-3px, 2px); }
        75.000000% { transform: translate(0px, 2px); }
        83.333333% { transform: translate(3px, 2px); }
        91.666667% { transform: translate(4px, 2px); }
      }

      /* The wobble: translation against planted legs, never rotation, and on
         the full twelve seconds rather than a two second cycle repeated six
         times.

         **This is what earns the loop length.** With a 2s sway the file
         rendered four seconds: three identical stars four cells apart on a
         twelve-cell path are invariant under a four-cell rotation, so the
         orbit's visual period is eight frames, and 32/16/8 all divide 32.
         Frames 32-95 were byte-for-byte copies of 0-31 in a 402KB bake, while
         the comment above claimed a resting screen built like `idle`. `idle`
         earns sixteen seconds with blinks, two looks and a yawn; a stagger
         that repeats every four is not a stagger, it is a metronome.

         So the amplitude varies across the twelve: two ordinary sways, two
         smaller ones, then a deeper lurch and a slow recovery. Every value is
         a multiple of 0.25 units — two whole device pixels — so nothing lands
         on a fraction. */
      #wobble {
        animation: stagger 12s infinite ease-in-out;
      }

      @keyframes stagger {
        0%        { transform: translate(-0.5px, 0); }
        8.333333% { transform: translate(0, -0.25px); }
        16.66667% { transform: translate(0.5px, 0); }
        25%       { transform: translate(0, -0.25px); }
        33.33333% { transform: translate(-0.25px, 0); }
        41.66667% { transform: translate(0, 0); }
        50%       { transform: translate(0.25px, 0); }
        58.33333% { transform: translate(0, -0.25px); }
        66.66667% { transform: translate(-0.75px, 0); }
        75%       { transform: translate(-0.5px, -0.25px); }
        83.33333% { transform: translate(0.5px, 0); }
        91.66667% { transform: translate(0.25px, -0.25px); }
        100%      { transform: translate(-0.5px, 0); }
      }

      /* `idle`'s breath, about the hips, so the body settles onto planted legs
         rather than lifting off them. */
      #breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 2s infinite alternate ease-in-out;
      }

      @keyframes breathe {
        from { transform: scale(1, 1) translate(0, 0); }
        to   { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      /* Crossed. Static offsets, not an animation. */
      #left-eye-cross  { transform: translateX(2px); }
      #right-eye-cross { transform: translateX(-2px); }

      /* Squashed about each eye's own line, never hidden — §Closing an eye.
         Linear, because a lid that accelerates reads as a wince.

         **This is also what makes the loop twelve seconds.** Without it the
         file rendered four: three identical stars four cells apart on a
         twelve-cell path are invariant under a four-cell rotation, so the
         orbit's visual period is eight frames rather than twenty-four, and
         frames 32-95 were byte-for-byte copies of 0-31 — a 402KB bake, two
         thirds of it duplicate, claiming to be a resting screen built like
         `idle`. A blink on a twelve-second track is the cheapest beat that
         makes the length real, and every other awake animation has one. */
      #left-eye-blink {
        transform-origin: 4.5px 9px;
        animation: blink 12s infinite linear;
      }

      #right-eye-blink {
        transform-origin: 10.5px 9px;
        animation: blink 12s infinite linear;
      }

      /* Two blinks, at frames 30 and 70 of 96, far enough apart that they
         never read as a pair. Two frames shut, every value a whole frame. */
      @keyframes blink {
        0%, 31.25%       { transform: scaleY(1); }
        32.291667%       { transform: scaleY(0.1); }
        33.333333%       { transform: scaleY(0.1); }
        34.375%          { transform: scaleY(1); }
        72.916667%       { transform: scaleY(1); }
        73.958333%       { transform: scaleY(0.1); }
        75.000000%       { transform: scaleY(0.1); }
        76.041667%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- ── three stars, orbiting above the head ──────────────────────────── -->
  <!-- A pale pip in a dark cross, drawn at the orbit's centre; the keyframes move
       the group — the keyframes translate by (cell - centre), so the rects
       have to sit at the centre and not at a cell, or every star is offset by
       the difference and two of the three end up touching.

       **Two tones, and it has to be.** A single pale pixel measured
       1.31:1 against the day sky and 1.80:1 against dawn — invisible, on the
       path the daemon takes — which is the third time this exact defect has
       landed: the boot splash's wordmark, `confused`'s caret, and this. No one
       flat tone reads against both a pale sky and a dark one. The cross
       carries the pale skies and the pip carries night.

       Black, not a near-black: `permission-sign` records what happens when a
       new dark tone is declared — it captures the antialiased edges the
       transparency rule needs and stitches a keyline round the character.

       The lowest cells are raised a unit so the cross's bottom arm clears the
       torso. The first version measured the *pip* at y=4 against a torso
       topping out at y=6 and concluded there was clearance; the arm is a unit
       below the pip, so it sat flush against the torso on 33 of 96 frames —
       a dark notch welded to the top of his head, which is on this plan's own
       "Not wanted" list. `asleep` shipped a glyph crossing the face once and
       it read as display corruption. Measure the prop, not its centre. -->
  <g>
    <g id="fx-star-a">
      <rect x="7" y="0" width="1" height="1" fill="#000000"/>
      <rect x="6" y="1" width="1" height="1" fill="#000000"/>
      <rect x="8" y="1" width="1" height="1" fill="#000000"/>
      <rect x="7" y="2" width="1" height="1" fill="#000000"/>
      <rect x="7" y="1" width="1" height="1" fill="#C9D1D9"/>
    </g>
    <g id="fx-star-b">
      <rect x="7" y="0" width="1" height="1" fill="#000000"/>
      <rect x="6" y="1" width="1" height="1" fill="#000000"/>
      <rect x="8" y="1" width="1" height="1" fill="#000000"/>
      <rect x="7" y="2" width="1" height="1" fill="#000000"/>
      <rect x="7" y="1" width="1" height="1" fill="#C9D1D9"/>
    </g>
    <g id="fx-star-c">
      <rect x="7" y="0" width="1" height="1" fill="#000000"/>
      <rect x="6" y="1" width="1" height="1" fill="#000000"/>
      <rect x="8" y="1" width="1" height="1" fill="#000000"/>
      <rect x="7" y="2" width="1" height="1" fill="#000000"/>
      <rect x="7" y="1" width="1" height="1" fill="#C9D1D9"/>
    </g>
  </g>

  <!-- ── base geometry: assets/clawd/base.svg, less its shadow ─────────── -->
  <g id="master-group">
    <!-- Planted, and outside the wobble: the foot line stays flat while the
         body moves over it. -->
    <g id="legs-group" fill="#DE886D">
      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>
    </g>

    <g id="wobble">
      <g id="breathe">
        <g id="body-color-group" fill="#DE886D">
          <rect id="torso" x="2" y="6" width="11" height="7"/>
          <rect id="left-arm" x="0" y="9" width="2" height="2"/>
          <rect id="right-arm" x="13" y="9" width="2" height="2"/>
        </g>

        <g id="eyes-color-group" fill="#000000">
          <g id="left-eye-cross">
            <g id="left-eye-blink">
              <rect id="left-eye" x="4" y="8" width="1" height="2"/>
            </g>
          </g>
          <g id="right-eye-cross">
            <g id="right-eye-blink">
              <rect id="right-eye" x="10" y="8" width="1" height="2"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

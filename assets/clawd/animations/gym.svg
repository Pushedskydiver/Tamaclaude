<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -9 21 25" width="168" height="200">
  <!--
    Clawd: gym (Bash)

    Generated against assets/clawd/base.svg under the contract in
    docs/ANIMATION.md. Every base element appears below at its original
    coordinates and colours; all motion is CSS applied by ID.

    First animation built to the rule that came out of `thinking`: on this
    geometry PROPS CARRY THE MOTION and limbs stay exactly where the base puts
    them (docs/ANIMATION.md §What pose swapping cannot do). No claw is
    repositioned to hold the bar — the bar simply travels, and the body dips
    under it. The lift reads from the prop, not the limb.

    No scale transform anywhere. A squash would be the obvious way to show
    load, but docs/ANIMATION.md's pixel arithmetic covers translation only, and
    a scaled edge lands between pixels. The body dips a whole unit instead.

    Loop: 1.0s at 8fps. The bar travels 4 units over 4 frames — exactly 1 unit,
    8 device pixels, per frame — then back. Periods of 1.0s only. Nothing runs
    at 0.125s.
  -->
  <defs>
    <style>
      /* One press per loop: down at frame 0, full extension at frame 4. */
      #fx-barbell {
        animation: press 1s infinite linear;
      }

      /* Held for two frames at the bottom of the rep rather than interpolated
         — a fractional dip would soften the whole silhouette. It covers frames
         0 and 1, the start of the drive; the bar is also at its lowest on
         frame 7, on the way down, where he is absorbing rather than pushing. */
      #master-group {
        animation: take-the-load 1s infinite steps(1);
      }

      /* Eyes track the bar. */
      #left-eye,
      #right-eye {
        animation: watch-the-bar 1s infinite steps(1);
      }

      /* Exertion marks, binary opacity. Visible frames 2-5, which is the
         drive plus the first frame of the descent — effort outlasting the
         movement by a frame reads better than effort stopping dead at lockout. */
      #fx-effort {
        animation: effort 1s infinite steps(1);
      }

      @keyframes press {
        0%   { transform: translateY(0); }
        50%  { transform: translateY(-4px); }
        100% { transform: translateY(0); }
      }

      @keyframes take-the-load {
        0%   { transform: translateY(1px); }
        25%  { transform: translateY(0); }
        100% { transform: translateY(0); }
      }

      @keyframes watch-the-bar {
        0%   { transform: translateY(0); }
        25%  { transform: translateY(-1px); }
        75%  { transform: translateY(0); }
        100% { transform: translateY(0); }
      }

      @keyframes effort {
        0%   { opacity: 0; }
        25%  { opacity: 1; }
        75%  { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- ── base geometry: assets/clawd/base.svg, verbatim ────────────────── -->
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g id="master-group">
    <g id="body-color-group" fill="#DE886D">
      <rect id="torso" x="2" y="6" width="11" height="7"/>
      <rect id="left-arm" x="0" y="9" width="2" height="2"/>
      <rect id="right-arm" x="13" y="9" width="2" height="2"/>

      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>
    </g>

    <g id="eyes-color-group" fill="#000000">
      <rect id="left-eye" x="4" y="8" width="1" height="2"/>
      <rect id="right-eye" x="10" y="8" width="1" height="2"/>
    </g>
  </g>

  <!-- ── additive props ────────────────────────────────────────────────── -->
  <!-- Barbell at its lowest position; the whole group translates. Plates sit
       clear of the torso top edge at y=6 when the bar is down. -->
  <g id="fx-barbell" fill="#8B949E">
    <rect x="3" y="4" width="9" height="1"/>
    <rect x="2" y="3" width="1" height="3"/>
    <rect x="12" y="3" width="1" height="3"/>
  </g>

  <g id="fx-effort" fill="#F0883E">
    <rect x="0" y="6" width="1" height="1"/>
    <rect x="14" y="6" width="1" height="1"/>
  </g>
</svg>

name: PR title check

# Validates PR titles against the gitmoji + conventional commit format in
# docs/GIT.md §Types. PR titles become the squash commit subject on `main`, so
# the same convention applies.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Validate PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title against gitmoji + conventional commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "Author is dependabot[bot] — bot owns title format; skipping."
            exit 0
          fi

          # Keep in sync with docs/GIT.md §Types — same convention, two homes.
          ALLOWED_PREFIXES=(
            "✨ feat" "🐛 fix" "📦 chore" "♻️ refactor" "✅ test"
            "📝 docs" "💄 style" "⚡️ perf" "🔒 security" "🔥 remove" "🔧 build"
          )

          for prefix in "${ALLOWED_PREFIXES[@]}"; do
            if [[ "$PR_TITLE" == "$prefix"* ]]; then
              remainder="${PR_TITLE#"$prefix"}"
              if [[ "$remainder" =~ ^(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
                echo "✅ PR title conforms: '$PR_TITLE'"
                exit 0
              fi
            fi
          done

          {
            echo "❌ PR title does not match the convention."
            echo ""
            echo "   Format: <gitmoji> <type>[(scope)]: <description>"
            echo ""
            echo "   Allowed prefixes:"
            for prefix in "${ALLOWED_PREFIXES[@]}"; do echo "     $prefix"; done
            echo ""
            echo "   Example: ✨ feat(protocol): add RLE dirty-rect encoder"
            echo ""
            echo "   Got: $PR_TITLE"
            echo ""
            echo "   Fix: gh pr edit ${{ github.event.pull_request.number }} --title \"<new title>\""
            echo "   See docs/GIT.md §Types for the full table."
          } >&2
          exit 1

# Tool versions for this repo, resolved by mise (https://mise.jdx.dev).
#
# mise rather than Volta: Volta resolves its pin from the nearest package.json and does not walk
# up a workspace, so any command run from inside a workspace package — which is every
# `pnpm --filter <pkg> <script>` — silently falls back to Volta's global default. mise walks up,
# so this one root file covers every package. (Lesson carried over from moe; see its mise.toml.)
[tools]
node = "24.16.0"
pnpm = "10.32.1"
